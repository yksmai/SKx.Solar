# Baut bei jedem Tag v* fertige Pakete für Pi und PC und hängt sie an ein GitHub-Release.
# deploy/get.sh lädt von dort, Nutzer brauchen kein .NET SDK.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Windows, weil publish.ps1 Windows-Pfade nutzt. Das Cross-Publish für ARM klappt von dort.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        run: dotnet test SKx.Solar.slnx -c Release

      - name: Pakete bauen
        shell: pwsh
        run: |
          foreach ($runtime in 'linux-arm64', 'linux-arm') {
              ./deploy/publish.ps1 -Runtime $runtime
              tar -C artifacts -czf "artifacts/skx-solar-$runtime.tar.gz" "skx-solar-$runtime"
              if ($LASTEXITCODE -ne 0) { throw 'Packen fehlgeschlagen.' }
          }
          ./deploy/publish.ps1 -Runtime win-x64
          Compress-Archive -Path artifacts/skx-solar-win-x64/app/* -DestinationPath artifacts/skx-solar-win-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/skx-solar-linux-arm64.tar.gz
            artifacts/skx-solar-linux-arm.tar.gz
            artifacts/skx-solar-win-x64.zip

      # Ohne Tag (manueller Lauf) nur als Download am Workflow-Lauf.
      - name: Pakete ablegen
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: skx-solar
          path: |
            artifacts/*.tar.gz
            artifacts/*.zip
